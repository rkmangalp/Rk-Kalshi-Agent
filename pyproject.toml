[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rk-kalshi-agent"
version = "0.1.0"
description = "Paper-trading agent for Kalshi prediction markets (Avellaneda–Stoikov + OBI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "cryptography>=42.0",
]

[project.scripts]
rk-kalshi = "rk_kalshi.cli:main"

[tool.setuptools.packages.find]
include = ["rk_kalshi*"]

[tool.setuptools.package-data]
rk_kalshi = ["static/*"]
